name: Build Conduit

on:
  push:
    branches: [ main, dev, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Tag the current commit as v<conduit.version> and publish a GitHub release with the built jar.'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up upstream Velocity source
        run: ./scripts/setup.sh --ci

      - name: Build and test
        run: ./gradlew build

      - name: Rename JAR
        id: rename
        run: |
          set -euo pipefail
          VERSION=$(grep "^conduit.version=" gradle.properties | cut -d= -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          shopt -s nullglob
          jars=( proxy/build/libs/velocity-proxy-*-all.jar )
          if [ ${#jars[@]} -ne 1 ]; then
            echo "Expected exactly one shadow JAR, found ${#jars[@]}: ${jars[*]}" >&2
            exit 1
          fi
          mv "${jars[0]}" "proxy/build/libs/conduit-${VERSION}.jar"

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: conduit-${{ github.sha }}
          path: proxy/build/libs/conduit-*.jar
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: '**/build/reports/tests/'
          retention-days: 14

      # Tag-triggered releases keep the tag name from the ref; the manual
      # (workflow_dispatch) path tags the current commit as v<conduit.version>.
      - name: Publish release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Conduit ${{ github.ref_name }}
          files: proxy/build/libs/conduit-*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rename.outputs.version }}
          name: Conduit v${{ steps.rename.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: proxy/build/libs/conduit-*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
