name: Build Conduit

on:
  push:
    branches: [ main, dev, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up upstream Velocity source
        run: ./scripts/setup.sh --ci

      - name: Build and test
        run: ./gradlew build

      - name: Rename JAR
        run: |
          set -euo pipefail
          VERSION=$(grep "^conduit.version=" gradle.properties | cut -d= -f2)
          shopt -s nullglob
          target="proxy/build/libs/conduit-${VERSION}.jar"
          # The Conduit shadowJar is already named conduit-<version>.jar (see the proxy build
          # script's shadowJar.archiveFileName). Older upstream builds instead produced
          # velocity-proxy-*-all.jar, so fall back to renaming that if the target is absent.
          if [ -f "$target" ]; then
            echo "Shadow JAR already named: $target"
          else
            jars=( proxy/build/libs/velocity-proxy-*-all.jar )
            if [ ${#jars[@]} -ne 1 ]; then
              echo "Expected exactly one shadow JAR, found ${#jars[@]}: ${jars[*]}" >&2
              exit 1
            fi
            mv "${jars[0]}" "$target"
          fi

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: conduit-${{ github.sha }}
          path: proxy/build/libs/conduit-*.jar
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: '**/build/reports/tests/'
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Conduit ${{ github.ref_name }}
          files: proxy/build/libs/conduit-*.jar
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
